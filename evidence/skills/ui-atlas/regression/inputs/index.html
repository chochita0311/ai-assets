<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fieldbook fixture</title>
<style>
body{font:16px system-ui;margin:0;background:#f6f6f2;color:#28392c}header{padding:24px;border-bottom:1px solid #ccc;background:#fff}main{max-width:760px;margin:30px auto;padding:20px}button{font:inherit;padding:10px;border:1px solid #adb9a9;background:white;border-radius:4px}button:focus-visible{outline:3px solid #346eab}#results{margin:24px 0;background:white;min-height:130px;padding:24px;border:1px solid #ccc}.tip-wrap{position:relative;display:inline-block}#tip{display:none;position:absolute;top:100%;left:0;background:#203b2a;color:white;padding:12px;width:240px;z-index:2}.tip-wrap:hover #tip,.tip-wrap:focus-within #tip{display:block}dialog{border:1px solid #aaa;padding:25px;max-width:400px}dialog::backdrop{background:#0004}.skeleton{height:12px;width:70%;margin-top:16px;background:#e1e6de}#notice{min-height:25px}
</style></head><body>
<header><svg id="fixture-icon" width="20" height="20" viewBox="0 0 20 20" aria-label="Notebook"><path id="fixture-mark" d="M3 3h14v14H3Z" fill="#55765f"/></svg> <strong>Fieldbook</strong> · A synthetic notebook</header>
<main><h1>노트</h1><div class="tip-wrap"><button id="help" aria-describedby="tip">도움말</button><span id="tip" role="tooltip">현재 선택한 노트만 동기화합니다.</span></div> <button id="open">설정</button>
<section id="results" aria-live="polite"><span>불러오는 중…</span><div class="skeleton"></div><div class="skeleton"></div></section>
<button id="sync">동기화</button><p id="notice" role="status"></p></main>
<dialog id="settings"><h2>표시 설정</h2><p>이 문구는 실제 모달 안에 있습니다.</p><button id="close">닫기</button></dialog>
<script>
fetch('/api/items').then(r=>{if(!r.ok)throw new Error();return r.json();}).then(items=>{document.querySelector('#results').textContent=items.length?items.join(' · '):'아직 노트가 없습니다.';}).catch(()=>{document.querySelector('#results').textContent='노트를 불러오지 못했습니다.';});
document.querySelector('#open').onclick=()=>document.querySelector('#settings').showModal();
document.querySelector('#close').onclick=()=>document.querySelector('#settings').close();
document.querySelector('#sync').onclick=async event=>{event.target.disabled=true;document.querySelector('#notice').textContent='동기화 중…';try{const result=await fetch('/api/sync',{method:'POST'});if(!result.ok)throw new Error();document.querySelector('#notice').textContent='동기화를 마쳤습니다.';}catch{document.querySelector('#notice').textContent='동기화하지 못했습니다. 다시 시도해 주세요.';}finally{event.target.disabled=false;}};
</script></body></html>
