interface:
  display_name: "GitHub PR Reviewer"
  short_description: "Draft or explicitly publish structured GitHub PR reviews"
  default_prompt: "Use $gh-review-pr as a direct or delegated task-owning reviewer within the supplied current-request authority. Review a frozen GitHub pull request snapshot under trusted versioned guidance, with a structured visible receipt, calibrated feedback profile, disciplined zero-finding evidence, and high-confidence inline findings. Use the separate omission-review role when required and keep requested re-review series bounded without assuming an adapter or worker name. Treat an ordinary review or re-review request as read-only draft work and write to GitHub only when the current request explicitly asks to publish or maintain skill-owned feedback."
