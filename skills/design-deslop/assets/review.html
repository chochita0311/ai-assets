<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; font-src data:; media-src data:; frame-src 'self' about:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Design review</title>
  <style>
    :root { color-scheme: light; --ink: #25332c; --muted: #6c756f; --line: #dce2dc; --paper: #f5f7f3; --accent: #275e46; --tint: #edf3ed; --danger: #963c34; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; color: var(--ink); background: var(--paper); font: 13px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, select, textarea, input { font: inherit; color: inherit; }
    button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; background: #fff; cursor: pointer; font-weight: 550; }
    button:hover:enabled { background: var(--tint); border-color: #9cad9d; }
    button:disabled { opacity: .48; cursor: not-allowed; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover:enabled { background: #194a37; }
    button[aria-pressed="true"] { color: var(--accent); background: #e4eee4; border-color: #8fa992; }
    :focus-visible { outline: 3px solid #497da9; outline-offset: 2px; }
    select { min-height: 34px; min-width: 0; max-width: 100%; border: 1px solid var(--line); border-radius: 4px; padding: 5px 24px 5px 8px; background: #fff; }
    textarea { width: 100%; border: 1px solid #c1ccc2; border-radius: 4px; padding: 10px; background: #fff; resize: vertical; line-height: 1.6; }
    h1, h2, h3, p, figure { margin: 0; }
    #app { height: 100vh; height: 100dvh; min-height: 540px; display: flex; flex-direction: column; }
    .page-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 62px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: #fff; }
    h1 { font-size: 18px; line-height: 1.3; letter-spacing: -.025em; }
    .header-meta { display: flex; align-items: center; gap: 12px; }
    .quiet, .badge { font-size: 12px; color: var(--muted); }
    .icon-button { width: 34px; padding: 5px; font-size: 16px; }
    #notice { border-bottom: 1px solid var(--line); background: var(--tint); padding: 7px 20px; font-size: 12px; }
    #notice[data-kind="error"] { background: #fff1ed; color: var(--danger); }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 300px; flex: 1; min-height: 0; }
    .visual-workspace { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 0 18px 18px; }
    .viewer-toolbar { display: flex; align-items: center; gap: 8px; min-height: 60px; flex-wrap: wrap; padding: 10px 0; }
    .component-navigation { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .focus-controls, .zoom-controls { display: flex; gap: 1px; }
    .focus-controls button, .zoom-controls button { background: transparent; border-color: transparent; padding-inline: 8px; white-space: nowrap; }
    .focus-controls button[aria-pressed="true"], .zoom-controls button[aria-pressed="true"] { background: #e5ece3; color: var(--ink); }
    #component-select { max-width: 170px; }
    #component-select:disabled { display: none; }
    .view-field { margin-left: auto; min-width: 0; }
    #view-select { max-width: 160px; }
    .viewer-more { position: relative; }
    .viewer-more > summary { list-style: none; cursor: pointer; padding: 4px 9px; font-size: 20px; }
    .viewer-more > summary::-webkit-details-marker { display: none; }
    .viewer-more > div { position: absolute; top: 36px; right: 0; z-index: 4; width: 205px; padding: 12px; background: #fff; border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 4px 18px #24312c12; }
    .link-control { display: flex; gap: 7px; align-items: center; font-size: 12px; }
    .link-control input { accent-color: var(--accent); }
    #reset-preview { margin-top: 10px; width: 100%; }
    #dom-status, .comparison-note { margin-bottom: 10px; font-size: 12px; color: #805719; padding: 8px 10px; background: #fff5e3; }
    #dom-status[data-dirty="true"] { color: var(--danger); }
    .comparison { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; flex: 1; min-height: 0; }
    .screenshot-pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .pane-heading { display: flex; align-items: baseline; gap: 8px; padding-bottom: 8px; min-width: 0; }
    .pane-kicker { color: var(--muted); font-size: 12px; flex-shrink: 0; }
    .pane-title { font-size: 12px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #before-title { display: none; }
    .image-viewport { position: relative; overflow: auto; flex: 1; min-height: 0; background: #e8ece5; border: 1px solid #d2dbd0; scrollbar-gutter: stable; overscroll-behavior: contain; }
    .capture-clip { position: relative; overflow: hidden; flex: none; background: #fff; }
    .capture { display: block; max-width: none; height: auto; }
    .capture-clip[data-crop="true"] .capture { position: absolute; }
    .dom-host { position: relative; flex: none; background: #fff; }
    .dom-host iframe { display: block; border: 0; transform-origin: top left; max-width: none; }
    .image-viewport[data-source="dom"] .pane-empty { position: absolute; inset: 0; background: #e8ece5; z-index: 1; }
    .pane-empty { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; padding: 20px; min-height: 100%; text-align: center; color: var(--muted); }
    .pane-empty p { font-size: 12px; max-width: 32ch; overflow-wrap: anywhere; }
    .review-sidebar { display: flex; flex-direction: column; min-height: 0; background: #fff; border-left: 1px solid var(--line); }
    .sidebar-heading { padding: 19px 16px 12px; }
    .sidebar-heading h2 { font-size: 13px; font-weight: 600; }
    .proposal-list { overflow: auto; flex: 0 1 auto; max-height: 35%; padding: 0 8px; }
    .proposal-row { padding: 7px 8px; border-left: 2px solid transparent; display: flex; align-items: center; gap: 4px; }
    .proposal-row[data-active="true"] { background: var(--tint); border-left-color: var(--accent); }
    .proposal-target { flex: 1; min-width: 0; text-align: left; justify-content: flex-start; border: 0; background: transparent; padding: 4px 0; }
    .proposal-target[aria-pressed="true"] { color: var(--ink); background: transparent; }
    .option-title { display: block; font-size: 12px; line-height: 1.45; }
    .option-actions { display: flex; gap: 1px; }
    .option-actions button { width: 27px; min-height: 29px; padding: 2px; font-size: 15px; border-color: transparent; background: transparent; }
    .option-actions button[aria-pressed="true"] { border-color: #a3b6a3; background: #e0eade; }
    .option-actions button[data-action="reject"][aria-pressed="true"] { color: var(--danger); background: #faeeeb; border-color: #dbb7ae; }
    .note-indicator { margin-left: 5px; color: var(--accent); }
    .selection-link { margin: 10px 16px 0; justify-content: space-between; font-size: 12px; background: #f7f9f5; }
    #selection-count { color: var(--muted); font-variant-numeric: tabular-nums; }
    .proposal-details { padding: 16px; overflow: auto; flex: 1; min-height: 0; }
    .note-label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 550; }
    #feedback-note { min-height: 88px; font-size: 12px; }
    .note-actions { display: flex; gap: 6px; margin-top: 7px; }
    .note-actions button { min-height: 26px; padding: 2px 6px; font-size: 11px; color: var(--muted); border-color: transparent; }
    details > summary { cursor: pointer; color: var(--muted); font-size: 12px; }
    .supporting-details { margin-top: 14px; }
    .detail-block { margin-top: 12px; font-size: 12px; overflow-wrap: anywhere; }
    .detail-block h4 { color: var(--muted); font-size: 11px; margin: 0 0 4px; }
    .detail-block ul { margin: 0; padding-left: 17px; }
    .proposal-component-scope { font-size: 12px; margin-top: 10px; }
    .overall-feedback { margin: 0 16px 12px; }
    .overall-feedback textarea { margin-top: 8px; min-height: 78px; max-height: 150px; font-size: 12px; }
    .overall-feedback[data-integrated="true"] { margin-top: 16px; flex: 1; }
    .overall-feedback[data-integrated="true"] > summary { color: var(--ink); font-weight: 550; }
    .element-tools { flex: none; padding: 12px 16px; border-top: 1px solid var(--line); background: #f7f9f5; }
    #element-reference { font: 11px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; min-height: 65px; max-height: 110px; margin: 6px 0; }
    .element-actions { display: flex; gap: 6px; }
    .element-actions button { min-height: 29px; padding: 3px 7px; font-size: 11px; }
    .decision-footer { padding: 12px 16px 16px; border-top: 1px solid var(--line); }
    #open-handoff { width: 100%; }
    .no-options { padding: 8px; color: var(--muted); }
    dialog { width: min(640px, calc(100% - 28px)); max-height: calc(100dvh - 40px); border: 1px solid #bcc8bb; border-radius: 6px; padding: 22px; color: var(--ink); box-shadow: 0 15px 70px #192e2a33; }
    dialog::backdrop { background: #17241d99; }
    .dialog-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .dialog-heading h2 { font-size: 18px; letter-spacing: -.025em; }
    .intent-controls { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .intent-controls button { font-size: 12px; }
    #export-explanation { color: var(--muted); font-size: 12px; margin: 12px 0; }
    #handoff-message { height: 260px; max-height: 42dvh; font-size: 13px; }
    #export-json { height: 190px; font: 11px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; margin-top: 10px; }
    .dialog-actions { display: flex; gap: 7px; margin: 12px 0; }
    .export-details { margin-top: 16px; }
    #apply-readiness, #constraints { font-size: 12px; color: var(--danger); margin-bottom: 12px; }
    #export-status { color: var(--accent); font-size: 12px; }
    .help-steps { padding-left: 20px; }
    .help-steps li { padding-left: 4px; margin: 14px 0; }
    .help-steps p { margin-top: 4px; color: var(--muted); font-size: 12px; }
    #help-dialog details { margin: 16px 0; }
    #help-dialog details p { margin-top: 8px; }
    #fatal-error { padding: 30px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    @media (max-width: 1120px) and (min-width: 761px) { .workspace { grid-template-columns: minmax(0, 1fr) 270px; } .visual-workspace { padding-inline: 12px; } .viewer-toolbar { gap: 4px; } #component-select { max-width: 120px; } .view-field { margin-left: 0; } .zoom-controls button { padding-inline: 5px; } }
    @media (max-width: 760px) {
      #app { height: auto; min-height: 100dvh; }
      .page-header { padding: 12px; min-height: 58px; }
      h1 { font-size: 16px; }
      .workspace { display: flex; flex-direction: column; flex: none; }
      .visual-workspace { height: calc(100dvh - var(--review-top-size, 58px)); min-height: 480px; padding: 0 9px 12px; }
      .viewer-toolbar { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 5px; min-height: 92px; }
      .component-navigation { grid-column: 1 / -1; }
      #component-select { max-width: 170px; }
      .view-field { margin-left: 0; flex: 1; }
      #view-select { width: 100%; }
      .comparison { gap: 7px; }
      .pane-heading { display: block; min-height: 42px; }
      .pane-kicker { font-size: 11px; }
      .pane-title { font-size: 11px; }
      .review-sidebar { border-left: 0; border-top: 1px solid var(--line); min-height: 310px; }
      .proposal-list { max-height: 280px; flex: none; }
      .proposal-details { flex: none; overflow: visible; }
      .pane-empty { padding: 12px 7px; }
      .pane-empty p { font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div id="app">
    <header class="page-header">
      <h1 id="review-title"></h1>
      <div class="header-meta"><span id="stage-label" class="badge" hidden></span><span id="format-label" class="badge" hidden></span><button id="show-help" class="icon-button" type="button" data-i18n-label="help" title="How to use">?</button></div>
    </header>
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <main class="workspace">
      <section class="visual-workspace" aria-label="Before and after comparison">
        <div class="viewer-toolbar">
          <div id="component-navigation" class="component-navigation" hidden>
            <div class="focus-controls" role="group" aria-label="Comparison scope"><button id="focus-whole" type="button" aria-pressed="true" data-i18n="wholeScreen">Whole screen</button><button id="focus-component" type="button" aria-pressed="false" data-i18n="componentFocus">Component</button></div>
            <select id="component-select" data-i18n-label="component"></select>
          </div>
          <div class="view-field"><select id="view-select" data-i18n-label="view"></select></div>
          <div class="zoom-controls" role="group" aria-label="Zoom"><button id="zoom-fit" type="button" aria-pressed="true" data-i18n="fit">Fit</button><button id="zoom-actual" type="button" aria-pressed="false">100%</button></div>
          <button id="element-picker" class="icon-button" type="button" aria-pressed="false" data-i18n-label="elementPicker">⌖</button>
          <details class="viewer-more"><summary data-i18n-label="viewOptions">⋯</summary><div><label class="link-control"><input id="linked-scroll" type="checkbox"><span data-i18n="linkScroll">Link scroll</span></label><button id="reset-preview" type="button" data-i18n="resetPreview">Reset preview</button></div></details>
        </div>
        <p id="dom-status" role="status" hidden></p>
        <p id="preview-notice" class="comparison-note" role="status" hidden></p>
        <div class="comparison" id="comparison-pair">
          <figure class="screenshot-pane" id="before-pane">
            <figcaption class="pane-heading"><p class="pane-kicker" data-i18n="before">Before</p><p id="before-title" class="pane-title"></p></figcaption>
            <div id="before-viewport" class="image-viewport" tabindex="0" role="region" aria-label="Original">
              <div id="before-dom-host" class="dom-host" hidden></div><div id="before-clip" class="capture-clip" hidden><img id="before-image" class="capture" alt="" hidden></div><div id="before-empty" class="pane-empty"><strong></strong><p></p></div>
            </div>
            <p id="before-meta" hidden></p>
          </figure>
          <figure class="screenshot-pane" id="after-pane">
            <figcaption class="pane-heading"><p id="after-kicker" class="pane-kicker"></p><p id="after-title" class="pane-title"></p></figcaption>
            <div id="after-viewport" class="image-viewport" tabindex="0" role="region" aria-label="Preview">
              <div id="after-dom-host" class="dom-host" hidden></div><div id="after-clip" class="capture-clip" hidden><img id="after-image" class="capture" alt="" hidden></div><div id="after-empty" class="pane-empty"><strong></strong><p></p></div>
            </div>
            <p id="after-meta" hidden></p>
          </figure>
        </div>
      </section>
      <aside class="review-sidebar" aria-label="Review choices">
        <div class="sidebar-heading"><h2 data-i18n="changes">Changes</h2></div>
        <div id="proposal-list" class="proposal-list"></div>
        <button id="integrated-comparison" class="selection-link" type="button" aria-pressed="false"><span data-i18n="integratedComparison">Selected combination</span><span id="selection-count"></span></button>
        <section id="proposal-details" class="proposal-details" aria-label="Active proposal details"></section>
        <details id="overall-feedback" class="overall-feedback"><summary data-i18n="overallFeedback">Overall feedback</summary><label class="sr-only" for="review-note" data-i18n="overallFeedback">Overall feedback</label><textarea id="review-note" rows="3"></textarea></details>
        <div id="element-tools" class="element-tools" hidden>
          <label for="element-reference" class="note-label" data-i18n="elementReference">Selected element</label><textarea id="element-reference" rows="3" readonly spellcheck="false"></textarea>
          <div class="element-actions"><button id="add-reference" type="button" data-i18n="addReference">Add to note</button><button id="copy-reference" type="button" data-i18n="copyReference">Copy</button><button id="close-reference" type="button" data-i18n="close">Close</button></div>
        </div>
        <footer class="decision-footer"><button id="open-handoff" class="primary" type="button" data-i18n="handoff">Share with agent</button></footer>
      </aside>
    </main>
  </div>
  <dialog id="export-dialog" aria-labelledby="export-title" aria-describedby="export-explanation">
    <div class="dialog-heading"><h2 id="export-title" data-i18n="handoff">Share with agent</h2><button id="close-export" class="icon-button" type="button" data-i18n-label="close">×</button></div>
    <div class="intent-controls" role="group" data-i18n-label="requestType"><button id="review-feedback" type="button" data-i18n="feedback">Request another draft</button><button id="apply-selected" type="button" data-i18n="apply" disabled>Apply accepted</button><button id="retain-original" type="button" data-i18n="retain">Keep original</button></div>
    <ul id="constraints" hidden></ul><p id="apply-readiness" hidden></p>
    <p id="export-explanation"></p>
    <textarea id="handoff-message" readonly data-i18n-label="agentMessage"></textarea>
    <div class="dialog-actions"><button id="copy-message" class="primary" type="button" data-i18n="copyMessage">Copy message</button></div>
    <p id="export-status" role="status" aria-live="polite"></p>
    <details class="export-details"><summary data-i18n="receiptDetails">Decision file</summary><textarea id="export-json" readonly spellcheck="false" aria-label="Decision JSON"></textarea><div class="dialog-actions"><button id="download-json" type="button" data-i18n="download">Download JSON</button><button id="copy-json" type="button" data-i18n="copy">Copy JSON</button></div></details>
  </dialog>
  <dialog id="help-dialog" aria-labelledby="help-title">
    <div class="dialog-heading"><h2 id="help-title" data-i18n="help">How to use</h2><button id="close-help" class="icon-button" type="button" data-i18n-label="close">×</button></div>
    <ol class="help-steps"><li><strong data-i18n="helpChoose">Choose a proposal</strong><p data-i18n="helpChooseDetail"></p></li><li><strong data-i18n="helpPartial">Keep only what you like</strong><p data-i18n="helpPartialDetail"></p></li><li><strong data-i18n="helpSend">Send your request</strong><p data-i18n="helpSendDetail"></p></li></ol>
    <details><summary data-i18n="reviewContext">Review details</summary><p id="review-identity" class="quiet"></p><p id="review-summary" class="quiet"></p><p id="selection-title" class="quiet"></p><p id="component-scope" class="quiet"></p><p id="view-conditions" class="quiet"></p><p id="scale-label" class="quiet"></p><p id="draft-status" class="quiet"></p><p id="preview-format-description" class="quiet"></p><p id="scroll-note" class="quiet" data-i18n="scrollNote"></p></details>
    <button id="import-decisions" type="button" data-i18n="import">Import JSON</button><input id="import-file" type="file" accept=".json,application/json" hidden>
  </dialog>
  <p id="fatal-error" role="alert" hidden></p>
  <script type="application/json" id="review-data">__REVIEW_DATA__</script>
  <script>__DOM_PREVIEW__</script>
  <script>
    (() => {
      "use strict";
      const $ = id => document.getElementById(id);
      let data;
      try { data = JSON.parse($("review-data").textContent); }
      catch (error) {
        $("app").hidden = true;
        $("fatal-error").hidden = false;
        $("fatal-error").textContent = "This review could not be opened: invalid embedded review data.";
        return;
      }

      const messages = {
        en: {
          overallFeedback: "Overall feedback", overallPlaceholder: "Feedback on the whole review, or a new direction to explore.",

      function validRegion(region, width, height) {

      }

      function previewSet(preview) {
        if (!preview) return [];
        return combinations.has(preview.id) ? preview.proposals : [preview.id];
      }

      function resolvePreview() {
        const ids = data.stage === "applied" ? data.applied : data.stage === "retained" ? [] : selectedIds();
        if (locked || state.mode === "selection") {
          if (ids.length === 0) return { item: null, id: null, ids: [], exact: true, original: true };
          const exact = exactPreview(ids);
          if (exact) return { item: exact, id: exact.id, ids, exact: true, original: false };
          const fallback = proposals.get(state.activeId) || proposals.get(ids[0]);
          return { item: fallback, id: fallback.id, ids: [fallback.id], exact: false, original: false, missingCombination: true };
        }
        const item = proposals.get(state.activeId);
        return item ? { item, id: item.id, ids: [item.id], exact: false, original: false } : { item: null, id: null, ids: [], exact: true, original: true };
      }

      function previewTitle(preview) {
        if (preview.original) return data.baseline.label;
        if (combinations.has(preview.id)) return preview.ids.map(id => proposals.get(id).title).join(" + ");
        return preview.item.title;
      }

      function evidenceIssues(preview) {
        if (!preview || preview.evidence !== "rendered") return [t("evidenceMissing")];
        const missing = [];
        for (const view of data.views) {
          const beforeReady = Object.hasOwn(view, "document") ? Boolean(view.document?.html) : isCapture(view.before);
          const afterReady = Object.hasOwn(preview.documents || {}, view.id) ? Boolean(preview.documents[view.id]?.html) : isCapture(preview.captures[view.id]);
          if (!beforeReady) missing.push(`${data.baseline.label} — ${view.label}`);
          if (!afterReady) missing.push(`${preview.id} — ${view.label}`);
        }
        return missing.length ? [t("missingViews", missing.join("; "))] : [];
      }

      function applicationIssue() {
        if (locked) return t(data.stage === "applied" ? "lockedApplied" : "lockedRetained");
        const ids = selectedIds();
        if (!ids.length) return t("selectFirst");
        if (constraints(ids).length) return t("resolveConstraints");
        if (!Object.keys(data.baseline.files).length) return t("sourceMissing");
        const exact = exactPreview(ids);
        if (!exact) return t("combinationMissing");
        const evidence = evidenceIssues(exact);
        if (evidence.length) return evidence[0];
        if (state.mode !== "selection" || !currentPreview.exact || !sameSet(currentPreview.ids, ids)) return t("inspectSelection");
        if (state.dirty) return t("domDirty");
        if (exportChecking) return t("checkingDOM");
        for (const side of ["before", "after"]) {
          if (paneSources[side] === "dom") {
            if (domStates[side].status === "missing") return t("domMissingDetail");
            if (domStates[side].status === "selector-missing") return t("domSelectorDetail");
            if (domStates[side].status === "error") return t("domErrorDetail");
            if (domStates[side].status !== "ready") return t("domPending");
          } else {
            if (imageStates[side].status === "region-missing") return t("regionIssue");
            if (imageStates[side].status === "error") return t("decodeError");
            if (imageStates[side].status !== "ready") return t("decodePending");
          }
        }
        return null;
      }

      function validateDecisions(decisions) {
        if (!exactKeys(decisions, data.proposals.map(proposal => proposal.id))) throw new Error(t("importOptions"));
        const clean = {};
        for (const proposal of data.proposals) {
          const choice = decisions[proposal.id];
          if (!exactKeys(choice, ["status", "note"]) || !["pending", "accept", "reject", "defer", "revise"].includes(choice.status) || typeof choice.note !== "string") throw new Error(t("importOptions"));
          if (locked && choice.status !== initialDecisions()[proposal.id].status) throw new Error(t("importLocked"));
          Object.defineProperty(clean, proposal.id, { value: { status: choice.status, note: choice.note }, enumerable: true, writable: true, configurable: true });
        }
        return clean;
      }

      function validateReceipt(receipt) {
        const keys = ["format", "version", "review_id", "round", "review_fingerprint", "intent", "preview_id", "selected", "decisions", "review_note", "exported_at"];
        if (!exactKeys(receipt, keys) || receipt.format !== "design-deslop-decisions" || receipt.version !== 1) throw new Error(t("importShape"));
        if (receipt.review_id !== data.review_id || receipt.round !== data.round || receipt.review_fingerprint !== data.review_fingerprint) throw new Error(t("importIdentity"));
        if (typeof receipt.review_note !== "string") throw new Error(t("importShape"));
        const decisions = validateDecisions(receipt.decisions);
        if (!Array.isArray(receipt.selected) || receipt.selected.some(id => typeof id !== "string" || !proposals.has(id)) || new Set(receipt.selected).size !== receipt.selected.length || !sameSet(receipt.selected, selectedIds(decisions))) throw new Error(t("importSelection"));
        if (receipt.preview_id !== null && (typeof receipt.preview_id !== "string" || (!proposals.has(receipt.preview_id) && !combinations.has(receipt.preview_id)))) throw new Error(t("importOptions"));
        if (!["review-feedback", "apply-selected", "retain-original"].includes(receipt.intent)) throw new Error(t("importIntent"));
        if (typeof receipt.exported_at !== "string" || !/^\d{4}-\d{2}-\d{2}T/.test(receipt.exported_at) || Number.isNaN(Date.parse(receipt.exported_at))) throw new Error(t("importDate"));
        if (receipt.intent === "retain-original" && (locked || receipt.selected.length)) throw new Error(t("importIntent"));
        if (receipt.intent === "apply-selected") {
          const preview = proposals.get(receipt.preview_id) || combinations.get(receipt.preview_id);
          if (locked || !receipt.selected.length || !Object.keys(data.baseline.files).length || constraints(receipt.selected).length || !preview || !sameSet(previewSet(preview), receipt.selected) || evidenceIssues(preview).length) throw new Error(t("importIntent"));
        }
        return decisions;
      }

      function saveDraft() {
        try {
          localStorage.setItem(storageKey, JSON.stringify({ version: 1, review_fingerprint: data.review_fingerprint, round: data.round, decisions: state.decisions, review_note: state.reviewNote }));
          state.storage = "saved";
        } catch (error) { state.storage = "unavailable"; }
        renderDraftStatus();
      }

      function restoreDraft() {
        try {
          const saved = localStorage.getItem(storageKey);
          if (!saved) return;
          try {
            const draft = JSON.parse(saved);
            if (!exactKeys(draft, ["version", "review_fingerprint", "round", "decisions", "review_note"]) || draft.version !== 1 || draft.review_fingerprint !== data.review_fingerprint || draft.round !== data.round || typeof draft.review_note !== "string") throw new Error("identity");
            state.decisions = validateDecisions(draft.decisions);
            state.reviewNote = draft.review_note;
            state.storage = "saved";
            showNotice(t("restored"));
          } catch (error) { showNotice(t("invalidStored"), "error"); }
        } catch (error) { state.storage = "unavailable"; }
      }

      function renderDraftStatus() {
        $("draft-status").textContent = t(state.storage === "unavailable" ? "storageUnavailable" : state.storage === "saved" ? "draftSaved" : "draftOnly");
      }

      function buildList() {
        if (!data.proposals.length) {
          $("proposal-list").append(node("p", t("noOptions"), "no-options"));
          return;
        }
        for (const proposal of data.proposals) {
          const row = node("div", undefined, "proposal-row");
          row.dataset.proposalId = proposal.id;
          const target = node("button", undefined, "proposal-target");
          target.type = "button";
          target.dataset.proposalId = proposal.id;
          target.dataset.action = "preview";
          target.setAttribute("aria-controls", "proposal-details after-pane");
          const title = node("span");
          target.title = `${proposal.id} · ${proposal.title}`;
          const noteMark = node("span", "•", "note-indicator");
          noteMark.setAttribute("aria-label", t("notePresent"));
          title.append(node("span", proposal.title, "option-title"), noteMark);
          const status = node("span", "", "option-status sr-only");
          target.append(title, status);
          target.addEventListener("click", () => {
            enterProposal(proposal.id);
            renderList(); renderDetails(); renderPair();
          });
          const actions = node("div", undefined, "option-actions");
          actions.setAttribute("role", "group");
          actions.setAttribute("aria-label", proposal.title);
          const actionButtons = {};
          for (const [action, icon] of [["accept", "✓"], ["revise", "◐"], ["reject", "×"]]) {
            const button = node("button", icon);
            button.type = "button";
            button.dataset.action = action;
            button.dataset.proposalId = proposal.id;
            button.setAttribute("aria-label", `${t(action === "reset" ? "resetTitle" : action)} — ${proposal.title}`);
            button.title = t(action === "reset" ? "resetTitle" : action);
            button.disabled = locked;
            button.addEventListener("click", () => setDecision(proposal.id, action));
            actions.append(button);
            actionButtons[action] = button;
          }
          row.append(target, actions);
          $("proposal-list").append(row);
          rowElements.set(proposal.id, { row, target, status, noteMark, actionButtons });
        }
      }

      function renderList() {
        const statuses = { pending: "pending", accept: data.stage === "applied" ? "applied" : "accepted", reject: "rejected", defer: "deferred", revise: "revise" };
        for (const proposal of data.proposals) {
          const elements = rowElements.get(proposal.id);
          const decision = state.decisions[proposal.id];
          const active = state.mode === "individual" && state.activeId === proposal.id;
          elements.row.dataset.active = String(active);
          elements.row.dataset.status = decision.status;
          elements.target.setAttribute("aria-pressed", String(active));
          elements.status.textContent = t(statuses[decision.status]);
          elements.noteMark.hidden = !decision.note;
          for (const [action, button] of Object.entries(elements.actionButtons)) {
            if (action !== "reset") button.setAttribute("aria-pressed", String(decision.status === action));
          }
        }
      }

      function setDecision(id, action) {
        if (locked) return;
        const before = selectedIds();
        const proposal = proposals.get(id);
        const next = action === "reset" || state.decisions[id].status === action ? "pending" : action;
        let notice = "";
        if (next === "accept") {
          for (const sibling of data.proposals) {
            if (sibling.id !== id && group(sibling) === group(proposal) && state.decisions[sibling.id].status === "accept") {
              state.decisions[sibling.id].status = "pending";
              notice = t("siblingNotice", sibling.title, proposal.title);
            }
          }
        }
        state.decisions[id].status = next;
        const activeChanged = state.activeId !== id;
        if (state.mode !== "individual" || !sameSet(before, selectedIds()) || activeChanged) enterProposal(id);
        showNotice(notice);
        saveDraft(); renderList(); renderDetails(); renderPair();
        if (next === "revise") $("feedback-note")?.focus();
      }

      function detailBlock(label, value) {
        const block = node("div", undefined, "detail-block");
        block.append(node("h4", label));
        if (Array.isArray(value) && value.length) {
          const list = node("ul");
          value.forEach(item => list.append(node("li", item)));
          block.append(list);
        } else block.append(node("p", Array.isArray(value) ? t("noneRecorded") : value));
        return block;
      }

      function renderDetails() {
        const container = $("proposal-details");
        container.replaceChildren();
        const integrated = state.mode !== "individual";
        container.hidden = integrated && data.proposals.length > 0;
        $("overall-feedback").dataset.integrated = String(integrated);
        if (integrated) $("overall-feedback").open = true;
        const proposal = proposals.get(state.activeId);
        if (!proposal) {
          container.append(node("h3", t("noOptions")), detailBlock(t("originalDescription"), data.baseline.description), node("p", locked ? t(data.stage === "applied" ? "appliedNotice" : "retainedNotice") : t("noOptionsDetail"), "detail-block"));
          return;
        }
        const partial = state.decisions[proposal.id].status === "revise";
        const label = node("label", t(partial ? "partialNote" : "note"), "note-label");
        label.htmlFor = "feedback-note";
        const note = node("textarea");
        note.id = "feedback-note";
        note.dataset.proposalId = proposal.id;
        note.rows = 3;
        note.value = state.decisions[proposal.id].note;
        note.placeholder = t(partial ? "partialPlaceholder" : "notePlaceholder");
        note.addEventListener("input", () => {
          state.decisions[proposal.id].note = note.value;
          rowElements.get(proposal.id).noteMark.hidden = !note.value;
          saveDraft();
        });
        container.append(label, note);
        const extra = node("div", undefined, "note-actions");
        for (const action of ["defer", "reset"]) {
          const button = node("button", t(action));
          button.type = "button";
          button.dataset.action = action;
          button.dataset.proposalId = proposal.id;
          button.disabled = locked;
          button.setAttribute("aria-pressed", String(action === "defer" && state.decisions[proposal.id].status === action));
          button.addEventListener("click", () => setDecision(proposal.id, action));
          extra.append(button);
        }
        container.append(extra);
        const supporting = node("details", undefined, "supporting-details");
        supporting.append(node("summary", t("supportingDetails")));
        for (const field of ["question", "observation", "benefit", "tradeoff", "scope", "preserved", "checks"]) supporting.append(detailBlock(t(field), proposal[field]));
        if (proposal.components?.length) supporting.append(node("p", t("proposalComponents", proposal.components.map(id => components.get(id).label).join(", ")), "proposal-component-scope"));
        if (proposal.requires.length) supporting.append(detailBlock(t("requires"), proposal.requires.map(id => proposals.get(id).title)));
        const conflictIds = data.proposals.filter(other => other.id !== proposal.id && (proposal.conflicts.includes(other.id) || other.conflicts.includes(proposal.id))).map(other => other.title);
        if (conflictIds.length) supporting.append(detailBlock(t("conflicts"), conflictIds));
        container.append(supporting);
      }

      function showEmpty(side, status) {
        if (paneSources[side] === "dom") return;
        const box = $(`${side}-empty`);
        const key = status === "combination-missing" ? "combinationUnavailable" : status === "region-missing" ? "regionMissing" : status === "error" ? "failed" : status === "loading" ? "loading" : "missing";
        box.querySelector("strong").textContent = t(key);
        box.querySelector("p").textContent = status === "region-missing" && side === "after" && currentPreview.missingCombination ? t("regionCombinationDetail") : t(`${key}Detail`, components.get(state.componentId)?.label || "");
        box.querySelector("button")?.remove();
        if (status === "region-missing") {
          const whole = node("button", t("wholeScreen"));
          whole.type = "button";
          whole.addEventListener("click", () => { state.focus = "whole"; renderPair(); });
          box.append(whole);
        }
        box.hidden = false;
        $(`${side}-image`).hidden = true;
        $(`${side}-clip`).hidden = true;
        $(`${side}-meta`).textContent = t(key);
      }

      function loadCapture(side, source, label, generation, region) {
        const image = $(`${side}-image`);
        const clip = $(`${side}-clip`);
        const viewport = $(`${side}-viewport`);
        image.onload = null;
        image.onerror = null;
        image.removeAttribute("src");
        viewport.scrollTop = 0; viewport.scrollLeft = 0;
        image.alt = label;
        const crop = state.focus === "component";
        const missingCombination = side === "after" && currentPreview.missingCombination && (state.integrated || state.source === "dom");
        imageStates[side] = { status: missingCombination ? "combination-missing" : !isCapture(source) ? "missing" : crop && !region ? "region-missing" : "loading", region };
        showEmpty(side, imageStates[side].status);
        if (imageStates[side].status !== "loading") return;
        const failed = () => {
          if (generation !== renderGeneration) return;
          imageStates[side] = { status: "error" };
          showEmpty(side, "error");
          renderFooter();
        };
        image.onerror = failed;
        image.onload = async () => {
          try {
            if (typeof image.decode === "function") await image.decode();
            if (generation !== renderGeneration) return;
            const view = data.views.find(item => item.id === state.viewId);
            if (!image.naturalWidth || !image.naturalHeight || image.naturalWidth !== view.width) { failed(); return; }
            if (crop && !validRegion(region, image.naturalWidth, image.naturalHeight)) {
              imageStates[side] = { status: "region-missing", region: null };
              showEmpty(side, "region-missing");
              renderFooter();
              return;
            }
            imageStates[side] = { status: "ready", width: image.naturalWidth, height: image.naturalHeight, region };
            if (paneSources[side] === "capture") {
              image.hidden = false;
              clip.hidden = false;
              $(`${side}-empty`).hidden = true;
            }
            updateScale(); renderFooter();
          } catch (error) { failed(); }
        };
        image.src = source;
      }

      function renderPair(resetDOM = false) {
        currentPreview = resolvePreview();
        clearReference();
        renderComponents();
        const view = data.views.find(item => item.id === state.viewId);
        const documents = {
          before: view.document,
          after: currentPreview.original ? view.document : currentPreview.item?.documents?.[view.id]
        };
        paneSources.before = Object.hasOwn(view, "document") ? "dom" : "capture";
        paneSources.after = currentPreview.original ? paneSources.before : currentPreview.missingCombination || Object.hasOwn(currentPreview.item?.documents || {}, view.id) ? "dom" : "capture";
        state.source = Object.values(paneSources).includes("dom") ? "dom" : "capture";
        $("format-label").hidden = Object.values(paneSources).every(source => source === "dom");
        $("format-label").textContent = t(Object.values(paneSources).every(source => source === "capture") ? "captureFallback" : "mixedPreview");
        const title = currentPreview.missingCombination && (state.integrated || state.source === "dom") ? t("combinationUnavailable") : previewTitle(currentPreview);
        const generation = ++renderGeneration;
        domFocusPending = true;
        $("before-title").textContent = data.baseline.label;
        $("before-title").title = data.baseline.description;
        $("after-title").textContent = title;
        $("after-title").title = title;
        $("view-conditions").textContent = `${view.label} · ${t("pixels", view.width, view.height)} · ${view.conditions}`;
        let kicker = "afterOption";
        if (data.stage === "applied") kicker = "afterApplied";
        else if (data.stage === "retained") kicker = "afterOriginal";
        else if (currentPreview.original) kicker = "afterUnchanged";
        else if (state.mode === "selection" && currentPreview.exact) kicker = "afterSelection";
        $("after-kicker").textContent = t(kicker);
        const notice = $("preview-notice");
        notice.dataset.kind = locked ? "outcome" : "evidence";
        if (locked) notice.textContent = t(data.stage === "applied" ? "appliedNotice" : "retainedNotice");
        else if (currentPreview.missingCombination) notice.textContent = state.integrated || state.source === "dom" ? t("combinationIntegratedNotice") : t("missingCombination", title);
        else if (currentPreview.item?.evidence === "concept") notice.textContent = t("conceptNotice");
        else if (currentPreview.item?.evidence === "unavailable") notice.textContent = t("unavailableNotice");
        else notice.textContent = "";
        notice.hidden = !notice.textContent;
        for (const side of ["before", "after"]) {
          const source = paneSources[side];
          const descriptor = side === "after" && currentPreview.missingCombination ? null : documents[side];
          domStates[side] = { status: source === "dom" && descriptor ? "loading" : "missing" };
          $(`${side}-dom-host`).dataset.status = domStates[side].status;
          $(`${side}-dom-host`).hidden = source !== "dom";
          $(`${side}-viewport`).dataset.source = source;
          $(`${side}-viewport`).setAttribute("aria-label", t(source === "dom" ? "domInspectRegion" : side === "before" ? "originalRegion" : "previewRegion"));
          domControllers[side].load(source === "dom" ? descriptor : null, { generation, viewId: view.id, previewId: side === "before" || currentPreview.original ? "baseline" : currentPreview.id, componentId: state.focus === "component" ? state.componentId : null, width: view.width, height: view.height }, resetDOM);
          if (source === "dom") renderDOMPane(side);
          else loadCapture(side, side === "before" || currentPreview.original ? view.before : currentPreview.item.captures[view.id], side === "before" ? t("baselineAlt", data.baseline.label, view.label) : t("previewAlt", title, view.label), generation, focusedRegion(side, view));
        }
        renderDOMStatus(); updateScale(); renderFooter();
      }

      function updateScale() {
        const view = data.views.find(item => item.id === state.viewId);
        const sides = ["before", "after"];
        const available = Math.max(1, Math.min($("before-viewport").clientWidth, $("after-viewport").clientWidth));
        const widths = sides.map(side => paneSources[side] === "dom" ? domStates[side].focusRect?.width : imageStates[side].region?.width);
        const focused = state.focus === "component";
        const focusReady = focused && widths.every(Boolean);
        const referenceWidth = focusReady ? Math.max(...widths) : view.width;
        const fitScale = available / referenceWidth;
        const scale = state.zoom === "actual" ? 1 : focused || state.source === "dom" ? Math.min(fitScale, 1) : fitScale;
        const percent = Math.round(scale * 100);
        for (const side of sides) {
          if (paneSources[side] === "dom") {
            domControllers[side].setScale(scale, view.width, view.height);
            if (["ready", "dirty", "selector-missing"].includes(domStates[side].status)) $(`${side}-meta`).textContent = t("domMeta", view.width, view.height, percent);
            if (focusReady && domFocusPending) {
              const rect = domStates[side].focusRect;
              $(`${side}-viewport`).scrollLeft = Math.max(0, rect.x * scale - 4);
              $(`${side}-viewport`).scrollTop = Math.max(0, rect.y * scale - 4);
            }
          } else {
            const image = $(`${side}-image`);
            const clip = $(`${side}-clip`);
            const capture = imageStates[side];
            const region = focused ? capture.region : null;
            clip.dataset.crop = String(focused);
            clip.dataset.scale = String(scale);
            image.style.width = `${(capture.width || view.width) * scale}px`;
            image.style.left = `${region ? -region.x * scale : 0}px`;
            image.style.top = `${region ? -region.y * scale : 0}px`;
            clip.style.width = `${(region ? region.width : capture.width || view.width) * scale}px`;
            clip.style.height = region ? `${region.height * scale}px` : "auto";
            if (capture.status === "ready") $(`${side}-meta`).textContent = t(region ? "componentCaptureInfo" : "captureInfo", region ? region.width : capture.width, region ? region.height : capture.height, percent);
          }
        }
        if (focusReady) domFocusPending = false;
        $("scale-label").textContent = `${percent}%`;
        $("zoom-fit").setAttribute("aria-pressed", String(state.zoom === "fit"));
        $("zoom-actual").setAttribute("aria-pressed", String(state.zoom === "actual"));
      }

      function updateWorkspaceSize() {
        const top = document.querySelector(".page-header").getBoundingClientRect().height + $("notice").getBoundingClientRect().height;
        document.documentElement.style.setProperty("--review-top-size", `${top}px`);
        document.documentElement.style.setProperty("--review-footer-size", `${document.querySelector(".decision-footer").getBoundingClientRect().height}px`);
      }

      function renderFooter() {
        const ids = selectedIds();
        $("selection-count").textContent = ids.length || "";
        const named = ids.map(id => `${proposals.get(id).title} (${id})`).join(" + ");
        $("selection-title").textContent = locked ? `${t(data.stage === "applied" ? "currentApplied" : "currentRetained", data.applied.length)}${named ? ` · ${named}` : ""}` : ids.length ? `${t("selection", ids.length)} · ${named}` : t("noSelection");
        const issues = constraints(ids);
        $("constraints").replaceChildren(...issues.map(issue => node("li", issue)));
        $("constraints").hidden = !issues.length;
        const issue = applicationIssue();
        $("apply-selected").disabled = Boolean(issue);
        const readyMessage = t(state.source === "dom" ? "domReady" : "ready");
        $("apply-selected").title = issue || readyMessage;
        $("retain-original").disabled = locked || ids.length !== 0;
        $("apply-readiness").textContent = issue || readyMessage;
        $("apply-readiness").hidden = !issue || locked || exportReceipt?.intent !== "apply-selected";
        $("apply-readiness").dataset.ready = String(!issue);
        renderDraftStatus();
      }

      function handoffMessage(intent) {
        const instructions = t(intent === "apply-selected" ? "messageApply" : intent === "retain-original" ? "messageRetain" : "messageFeedback");
        const statuses = { pending: "pending", accept: "accepted", reject: "rejected", defer: "deferred", revise: "revise" };
        const lines = [data.title, instructions, ""];
        for (const proposal of data.proposals) {
          const decision = state.decisions[proposal.id];
          lines.push(`${proposal.id} — ${proposal.title}: ${t(statuses[decision.status])}`);
          if (decision.note) lines.push(decision.note);
        }
        if (state.reviewNote) lines.push("", `${t("overallFeedback")}:`, state.reviewNote);
        if (intent === "apply-selected") lines.push("", `${t("messageSelection")}: ${selectedIds().join(" + ")} (${currentPreview.id})`);
        lines.push("", `${t("messageIdentity")}: ${data.review_id} / ${t("round", data.round)}`, `review_fingerprint: ${data.review_fingerprint}`);
        return lines.join("\n");
      }

      async function openExport(intent) {
        if (intent === "apply-selected" && applicationIssue()) return;
        if (intent === "apply-selected") {
          const generation = renderGeneration;
          exportChecking = true;
          renderFooter();
          const fresh = await Promise.all(Object.values(domControllers).map(controller => controller.check()));
          exportChecking = false;
          renderFooter();
          if (generation !== renderGeneration || fresh.some(value => !value) || applicationIssue()) return;
        }
        if (intent === "retain-original" && (locked || selectedIds().length)) return;
        exportReceipt = { format: "design-deslop-decisions", version: 1, review_id: data.review_id, round: data.round, review_fingerprint: data.review_fingerprint, intent, preview_id: currentPreview.id, selected: selectedIds(), decisions: state.decisions, review_note: state.reviewNote, exported_at: new Date().toISOString() };
        const kind = intent === "apply-selected" ? "Apply" : intent === "retain-original" ? "Retain" : "Feedback";
        $("export-explanation").textContent = t(`export${kind}`);
        $("export-json").value = JSON.stringify(exportReceipt, null, 2);
        $("handoff-message").value = handoffMessage(intent);
        for (const [id, value] of [["review-feedback", "review-feedback"], ["apply-selected", "apply-selected"], ["retain-original", "retain-original"]]) $(id).setAttribute("aria-pressed", String(intent === value));
        $("export-status").textContent = "";
        if (!$("export-dialog").open) $("export-dialog").showModal();
      }

      async function exportStillFresh() {
        if (exportReceipt?.intent !== "apply-selected") return true;
        const generation = renderGeneration;
        const fresh = await Promise.all(Object.values(domControllers).map(controller => controller.check()));
        if (generation !== renderGeneration || fresh.some(value => !value) || applicationIssue()) {
          if ($("export-dialog").open) $("export-dialog").close();
          renderFooter();
          return false;
        }
        return true;
      }

      document.documentElement.lang = language;
      document.title = data.title;
      document.querySelectorAll("[data-i18n]").forEach(element => { element.textContent = t(element.dataset.i18n); });
      document.querySelectorAll("[data-i18n-label]").forEach(element => { element.setAttribute("aria-label", t(element.dataset.i18nLabel)); element.title = t(element.dataset.i18nLabel); });
      document.querySelector(".visual-workspace").setAttribute("aria-label", t("compareLabel"));
      document.querySelector(".zoom-controls").setAttribute("aria-label", t("zoomLabel"));
      document.querySelector(".focus-controls").setAttribute("aria-label", t("comparisonScope"));
      document.querySelector(".review-sidebar").setAttribute("aria-label", t("choicesLabel"));
      $("proposal-details").setAttribute("aria-label", t("detailsLabel"));
      $("before-viewport").setAttribute("aria-label", t("originalRegion"));
      $("after-viewport").setAttribute("aria-label", t("previewRegion"));
      $("export-json").setAttribute("aria-label", t("decisionJSON"));
      $("review-note").placeholder = t("overallPlaceholder");
      $("review-note").addEventListener("input", event => { state.reviewNote = event.target.value; saveDraft(); });
      $("review-title").textContent = data.title;
      $("review-summary").textContent = data.summary;
      $("review-summary").hidden = !data.summary;
      $("stage-label").textContent = t(data.stage === "applied" ? "stageApplied" : data.stage === "retained" ? "stageRetained" : "stageProposal");
      $("stage-label").hidden = !locked;
      $("format-label").hidden = hasDocuments;
      $("format-label").textContent = t("captureFallback");
      $("preview-format-description").textContent = t(hasDocuments ? "domDescription" : "captureDescription");
      $("review-identity").textContent = `${data.review_id} · ${t("round", data.round)}`;
      for (const view of data.views) {
        const option = node("option", view.label);
        option.value = view.id;
        $("view-select").append(option);
      }
      $("view-select").setAttribute("aria-label", t("view"));
      $("view-select").addEventListener("change", event => { state.viewId = event.target.value; renderPair(); });
      $("focus-whole").addEventListener("click", () => { state.focus = "whole"; renderPair(); });
      $("focus-component").addEventListener("click", () => { state.focus = "component"; renderPair(); });
      $("component-select").addEventListener("change", event => { state.componentId = event.target.value; state.focus = "component"; renderPair(); });
      $("integrated-comparison").addEventListener("click", () => { state.mode = locked ? "outcome" : "selection"; state.focus = "whole"; state.integrated = true; renderList(); renderDetails(); renderPair(); });
      $("element-picker").addEventListener("click", () => {
        state.picker = !state.picker;
        for (const controller of Object.values(domControllers)) controller.setPicker(state.picker);
        renderDOMStatus();
      });
      $("reset-preview").addEventListener("click", () => {
        state.dirty = false;
        state.picker = false;
        for (const controller of Object.values(domControllers)) controller.setPicker(false);
        renderPair(true);
      });
      $("close-reference").addEventListener("click", clearReference);
      $("copy-reference").addEventListener("click", async () => {
        try {
          if (!navigator.clipboard?.writeText) throw new Error("Clipboard unavailable");
          await navigator.clipboard.writeText($("element-reference").value);
          showNotice(t("referenceCopied"));
        } catch (error) {
          $("element-reference").focus(); $("element-reference").select();
          showNotice(t("referenceFallback"));
        }
      });
      $("add-reference").addEventListener("click", () => {
        if (!selectedReference) return;
        const reference = $("element-reference").value;
        if (selectedReference.proposalId) {
          const choice = state.decisions[selectedReference.proposalId];
          choice.note = [choice.note, reference].filter(Boolean).join("\n\n");
          renderDetails(); renderList();
          $("feedback-note")?.focus();
        } else {
          state.reviewNote = [state.reviewNote, reference].filter(Boolean).join("\n\n");
          $("review-note").value = state.reviewNote;
          $("overall-feedback").open = true;
          $("review-note").focus();
        }
        saveDraft(); clearReference();
      });
      $("zoom-fit").addEventListener("click", () => { state.zoom = "fit"; domFocusPending = true; updateScale(); });
      $("zoom-actual").addEventListener("click", () => { state.zoom = "actual"; domFocusPending = true; updateScale(); });
      for (const side of ["before", "after"]) {
        const source = $(`${side}-viewport`);
        const target = $(`${side === "before" ? "after" : "before"}-viewport`);
        source.addEventListener("scroll", () => {
          if (!$("linked-scroll").checked || (scrollLeader && scrollLeader !== side)) return;
          scrollLeader = side;
          clearTimeout(scrollRelease);
          const vertical = source.scrollHeight - source.clientHeight;
          const horizontal = source.scrollWidth - source.clientWidth;
          target.scrollTop = vertical > 0 ? source.scrollTop / vertical * (target.scrollHeight - target.clientHeight) : 0;
          target.scrollLeft = horizontal > 0 ? source.scrollLeft / horizontal * (target.scrollWidth - target.clientWidth) : 0;
          scrollRelease = setTimeout(() => { scrollLeader = null; }, 80);
        }, { passive: true });
      }
      $("open-handoff").addEventListener("click", () => openExport("review-feedback"));
      $("show-help").addEventListener("click", () => $("help-dialog").showModal());
      $("close-help").addEventListener("click", () => $("help-dialog").close());
      $("review-feedback").addEventListener("click", () => openExport("review-feedback"));
      $("apply-selected").addEventListener("click", () => openExport("apply-selected"));
      $("retain-original").addEventListener("click", () => openExport("retain-original"));
      $("close-export").addEventListener("click", () => $("export-dialog").close());
      $("copy-message").addEventListener("click", async () => {
        if (!await exportStillFresh()) return;
        try {
          if (!navigator.clipboard?.writeText) throw new Error("Clipboard unavailable");
          await navigator.clipboard.writeText($("handoff-message").value);
          $("export-status").textContent = t("messageCopied");
        } catch (error) {
          $("handoff-message").focus(); $("handoff-message").select();
          $("export-status").textContent = t("messageCopyFallback");
        }
      });
      $("copy-json").addEventListener("click", async () => {
        if (!await exportStillFresh()) return;
        try {
          if (!navigator.clipboard?.writeText) throw new Error("Clipboard unavailable");
          await navigator.clipboard.writeText($("export-json").value);
          $("export-status").textContent = t("copied");
        } catch (error) {
          $("export-json").focus(); $("export-json").select();
          $("export-status").textContent = t("copyFallback");
        }
      });
      $("download-json").addEventListener("click", async () => {
        if (!await exportStillFresh()) return;
        let url;
        try {
          url = URL.createObjectURL(new Blob([$("export-json").value + "\n"], { type: "application/json" }));
          const link = node("a");
          link.href = url;
          link.download = `${data.review_id}-r${data.round}-${exportReceipt.intent}.json`;
          document.body.append(link); link.click(); link.remove();
          $("export-status").textContent = t("downloaded");
        } catch (error) { $("export-status").textContent = t("downloadFailed"); }
        finally { if (url) setTimeout(() => URL.revokeObjectURL(url), 1000); }
      });
      $("import-decisions").addEventListener("click", () => $("import-file").click());
      $("import-file").addEventListener("change", async event => {
        const file = event.target.files[0];
        if (!file) return;
        try {
          if (file.size > 10 * 1024 * 1024) throw new Error(t("importTooLarge"));
          const receipt = JSON.parse(await file.text());
          state.decisions = validateReceipt(receipt);
          state.reviewNote = receipt.review_note;
          $("review-note").value = state.reviewNote;
          state.mode = locked ? "outcome" : "individual";
          saveDraft(); renderList(); renderDetails(); renderPair();
          showNotice(t("imported"));
        } catch (error) { showNotice(t("importFailed", error.message), "error"); }
        finally { event.target.value = ""; }
      });
      if (typeof ResizeObserver === "function") {
        new ResizeObserver(updateScale).observe($("comparison-pair"));
        const layoutObserver = new ResizeObserver(updateWorkspaceSize);
        for (const element of [document.querySelector(".page-header"), $("notice"), document.querySelector(".decision-footer")]) layoutObserver.observe(element);
      } else window.addEventListener("resize", () => { updateWorkspaceSize(); updateScale(); });
      restoreDraft();
      const initialComponents = availableComponentIds();
      state.componentId = initialComponents[0] || null;
      state.focus = initialComponents.length ? "component" : "whole";
      buildList(); renderList(); renderDetails(); renderPair();
      $("review-note").value = state.reviewNote;
      updateWorkspaceSize();
    })();
  </script>
</body>
</html>
